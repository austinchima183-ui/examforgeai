<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4F46E5">
  <meta name="description" content="ExamForge AI — AI-Powered Educational Platform for schools, teachers, and students.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ExamForge">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32x32.png">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <title>ExamForge AI</title>
  <style>
    body { background-color: #FFFFFF; margin: 0; }
    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #4F46E5;
    }
    .loading-spinner::after {
      content: '';
      width: 40px;
      height: 40px;
      border: 4px solid #E0E7FF;
      border-top-color: #4F46E5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <!-- Console interceptor: Captures ALL console output for diagnostics -->
  <script>
    window.__efLog = [];
    window.__efErr = [];
    var _efOrigLog = console.log;
    var _efOrigErr = console.error;
    var _efOrigWarn = console.warn;
    console.log = function() {
      window.__efLog.push(Array.from(arguments).map(function(a){return typeof a==='object'?JSON.stringify(a):String(a)}).join(' '));
      _efOrigLog.apply(console, arguments);
    };
    console.error = function() {
      window.__efErr.push(Array.from(arguments).map(function(a){return typeof a==='object'?JSON.stringify(a):String(a)}).join(' '));
      _efOrigErr.apply(console, arguments);
    };
    console.warn = function() {
      window.__efLog.push('WARN: '+Array.from(arguments).map(function(a){return typeof a==='object'?JSON.stringify(a):String(a)}).join(' '));
      _efOrigWarn.apply(console, arguments);
    };
    window.addEventListener('error', function(e) {
      window.__efErr.push('UNCAUGHT: '+e.message+' at '+e.filename+':'+e.lineno);
    });
    window.addEventListener('unhandledrejection', function(e) {
      window.__efErr.push('UNHANDLED: '+String(e.reason));
    });
  </script>
</head>
<body>
  <div class="loading-spinner" id="loading-spinner"></div>
  <script src="flutter_bootstrap.js" async></script>
  <noscript>
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;color:#1E293B;text-align:center;padding:24px;">
      <div>
        <h1 style="font-size:24px;margin-bottom:12px;">ExamForge AI Requires JavaScript</h1>
        <p style="font-size:16px;color:#64748B;">Please enable JavaScript in your browser settings.</p>
      </div>
    </div>
  </noscript>
</body>
</html>
