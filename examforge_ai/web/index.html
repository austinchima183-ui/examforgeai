<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ─── Core Meta ──────────────────────────────────────────────────── -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4F46E5">
  <meta name="description" content="ExamForge AI — AI-Powered Educational Platform for schools, teachers, and students.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ExamForge">

  <!-- ─── PWA Manifest ──────────────────────────────────────────────── -->
  <link rel="manifest" href="manifest.json">

  <!-- ─── App Icons (placeholder paths) ─────────────────────────────── -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32x32.png">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">

  <!-- ─── Flutter Initialization ────────────────────────────────────── -->
  <title>ExamForge AI</title>
  <style>
    body { background-color: #FFFFFF; margin: 0; }
    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #4F46E5;
    }
    .loading-spinner::after {
      content: '';
      width: 40px;
      height: 40px;
      border: 4px solid #E0E7FF;
      border-top-color: #4F46E5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- ─── Fallback Loading Spinner ──────────────────────────────────── -->
  <div class="loading-spinner" id="loading-spinner"></div>

  <!-- ─── Flutter Entry Point ───────────────────────────────────────── -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- ─── Service Worker Registration ───────────────────────────────── -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (registration) {
          console.log('[ExamForge] Service Worker registered with scope:', registration.scope);

          // Listen for service worker updates
          registration.addEventListener('updatefound', function () {
            var newWorker = registration.installing;
            newWorker.addEventListener('statechange', function () {
              if (newWorker.state === 'activated') {
                // Notify the Flutter app that an update is available
                if (navigator.serviceWorker.controller) {
                  window.dispatchEvent(new CustomEvent('sw-update-available'));
                }
              }
            });
          });
        }).catch(function (error) {
          console.warn('[ExamForge] Service Worker registration failed:', error);
        });

        // Handle controller change (new SW taking over)
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          console.log('[ExamForge] Service Worker controller changed');
        });
      });
    }
  </script>

  <!-- ─── NoScript Fallback ─────────────────────────────────────────── -->
  <noscript>
    <div style="
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #1E293B;
      text-align: center;
      padding: 24px;
    ">
      <div>
        <h1 style="font-size: 24px; margin-bottom: 12px;">ExamForge AI Requires JavaScript</h1>
        <p style="font-size: 16px; color: #64748B;">
          Please enable JavaScript in your browser settings to use ExamForge AI.
        </p>
      </div>
    </div>
  </noscript>
</body>
</html>
